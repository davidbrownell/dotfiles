variable_definitions:
  tools_dir: "String value indicating The directory where tools are stored."


entries:
  # ----------------------------------------------------------------------
  # |
  # |  General
  # |
  # ----------------------------------------------------------------------
  - source: "uv.env"
    dest: "{{ tools_dir }}/uv/uv.env"

  # ----------------------------------------------------------------------
  # |
  # |  Just
  # |
  # ----------------------------------------------------------------------

  # Windows
  - source: "just/run.cmd.jinja"
    dest: "{{ tools_dir }}/just/run.cmd"
    condition: is_windows

  # Linux / Not Windows
  - source: "just/run.jinja"
    dest: "{{ tools_dir }}/just/run"
    condition: not is_windows

  # ----------------------------------------------------------------------
  # |
  # |  lazygit
  # |
  # ----------------------------------------------------------------------

  # Windows
  - source: "lazygit/config.yml"
    dest: "%LOCALAPPDATA%/lazygit/config.yml"
    condition: is_windows

  # Linux / Not Windows
  - source: "lazygit/config.yml"
    dest: "~/.config/lazygit/config.yml"
    condition: not is_windows

  # ----------------------------------------------------------------------
  # |
  # |  Tuxedo
  # |
  # ----------------------------------------------------------------------

  # Windows
  - source: "tuxedo/tuxedo.cmd.jinja"
    dest: "{{ tools_dir }}/tuxedo/tuxedo.cmd"
    condition: is_windows

  # Linux / Not Windows
  - source: "tuxedo/tuxedo.jinja"
    dest: "{{ tools_dir }}/tuxedo/tuxedo"
    condition: not is_windows
